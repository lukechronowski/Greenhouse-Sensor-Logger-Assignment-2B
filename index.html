<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenhouse Sensor Logger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="portal-header">
        <div class="header-content">
            <div class="brand">
                <span class="brand-icon"></span>
                <h1>Greenhouse Sensor Logger</h1>
            </div>
            <div class="header-status">
                Active Logs: <span id="log-count" class="badge-count">0</span>
            </div>
        </div>
    </header>

    <main class="portal-container">
        <aside class="panel form-panel">
            <h2 class="panel-title">Record Sensor Reading</h2>
            <div id="form-error-banner" class="alert alert-danger hidden" role="alert"></div>
            <form action="#" id="sensor-form" novalidate>
                <div class="form-group">
                    <label for="bayId" class="form-label">Greenhouse Bay<span class="required">*</span></label>
                    <input type="text" name="bayId" id="bayId" class="form-control" placeholder="e.g. Bay A1" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="pH" class="form-label">pH Level<span class="required">*</span></label>
                        <input type="number" name="pH" id="pH" class="form-control" min="0" max="14" step="0.1" placeholder="6.0" required>
                    </div>
                    <div class="form-group">
                        <label for="ec" class="form-label">EC (mS/cm)<span class="required">*</span></label>
                        <input type="number" name="ec" id="ec" class="form-control" min="0" max="6" step="0.1" placeholder="1.5" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="temp" class="form-label">Temperature (°F)<span class="required">*</span></label>
                        <input type="number" name="temp" id="temp" class="form-control" min="0" max="120" step="0.1" placeholder="68.0" required>
                    </div>
                    <div class="form-group">
                        <label for="humidity" class="form-label">Relative Humidity (%)<span class="required">*</span></label>
                        <input type="number" name="humidity" id="humidity" class="form-control" min="0" max="100" step="0.1" placeholder="60.0" required>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn btn-primary btn-block">Record Reading</button>
            </form>
        </aside>

        <section class="panel records-panel">
            <div class="records-header">
                <h2 class="panel-title">Telemetry Log History</h2>
                <button type="button" id="btn-clear-all" class="btn btn-outline-danger">Purge Log History</button>
            </div>

            <div id="empty-state" class="empty-state">
                <span class="empty-icon"></span>
                <p>No readings recorded.</p>
            </div>
            
            <ul id="records-list" class="records-grid" aria-live="polite"></ul>
        </section>
    </main>

    <footer class="portal-footer">
        <p>&copy; 2026 Greenhouse Sensor Logger. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
